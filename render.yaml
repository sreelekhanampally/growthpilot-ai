databases:
  - name: growthpilot-db
    databaseName: growthpilot
    user: growthpilot
    plan: free
    region: singapore

services:
  - type: web
    name: growthpilot-api
    runtime: python
    plan: free
    region: singapore
    buildCommand: python -m pip install --upgrade pip && pip install .
    startCommand: python -m growthpilot serve --host 0.0.0.0 --port $PORT --bootstrap-demo
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: growthpilot-db
          property: connectionString
      - key: WORKSPACE_SLUG
        value: demo-retail
      - key: CORS_ORIGINS
        sync: false
      - key: LLM_PROVIDER
        value: gemini
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: OLLAMA_ENABLED
        value: "false"
      - key: PYTHON_VERSION
        value: 3.11.11

  - type: web
    name: growthpilot-web
    runtime: static
    plan: free
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    autoDeploy: true
    envVars:
      - key: VITE_API_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

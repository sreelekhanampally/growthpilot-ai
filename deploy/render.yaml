databases:
  - name: growthpilot-db
    databaseName: growthpilot
    user: growthpilot
    plan: free
services:
  - type: web
    name: growthpilot-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase: { name: growthpilot-db, property: connectionString }
      - key: WORKSPACE_SLUG
        value: demo-retail
      - key: CORS_ORIGINS
        sync: false
  - type: web
    name: growthpilot-web
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
